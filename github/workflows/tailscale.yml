name: Tailscale Network Connection

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  connect-tailscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Afficher l IP Tailscale
        run: |
          echo "=========================================="
          echo "MON ADRESSE IP TAILSCALE EST :"
          tailscale ip -4
          echo "=========================================="
